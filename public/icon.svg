<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Outer Squircle Border Gradient -->
    <linearGradient id="pwaOuterBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Physics Energy Ribbon -->
    <linearGradient id="pwaPhysics" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Chemistry Quantum Ribbon -->
    <linearGradient id="pwaChem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Mathematics Power Ribbon -->
    <linearGradient id="pwaMath" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Apex Golden Star -->
    <linearGradient id="pwaGoldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Dark Shield Backdrop -->
    <linearGradient id="pwaBackdrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="pwaGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4f46e5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#pwaBackdrop)" stroke="url(#pwaOuterBorder)" stroke-width="12" filter="url(#pwaGlow)" />

  <!-- Target Grid Guidance Rings -->
  <circle cx="256" cy="256" r="160" stroke="#334155" stroke-width="4" stroke-dasharray="16 16" opacity="0.6" />
  <circle cx="256" cy="256" r="110" stroke="#475569" stroke-width="4" opacity="0.4" />

  <!-- Triad Blades -->
  <!-- Physics Blade -->
  <path d="M 256 80 C 215 140 120 260 100 320 C 90 350 110 380 140 380 C 180 380 220 330 256 256 Z" fill="url(#pwaPhysics)" opacity="0.95" />

  <!-- Chemistry Blade -->
  <path d="M 256 80 C 297 140 392 260 412 320 C 422 350 402 380 372 380 C 332 380 292 330 256 256 Z" fill="url(#pwaChem)" opacity="0.95" />

  <!-- Mathematics Base Horizon Blade -->
  <path d="M 140 380 C 180 420 332 420 372 380 C 320 340 192 340 140 380 Z" fill="url(#pwaMath)" opacity="0.95" />

  <!-- Central Delta Symbol -->
  <path d="M 256 185 L 315 295 L 197 295 Z" fill="#ffffff" opacity="0.95" />
  <path d="M 256 215 L 290 280 L 222 280 Z" fill="#1e1b4b" />

  <!-- Apex Star -->
  <g transform="translate(256, 80)">
    <polygon points="0,-40 12,-12 40,0 12,12 0,40 -12,12 -40,0 -12,-12" fill="url(#pwaGoldStar)" />
    <circle cx="0" cy="0" r="8" fill="#ffffff" />
  </g>

  <!-- Crosshair Ticks -->
  <line x1="256" y1="130" x2="256" y2="155" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="360" x2="256" y2="385" stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
  <line x1="130" y1="256" x2="155" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" />
  <line x1="360" y1="256" x2="385" y2="256" stroke="#34d399" stroke-width="8" stroke-linecap="round" />
</svg>
